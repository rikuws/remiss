name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "assets/**"
      - "scripts/capture-screenshot-*"
      - "scripts/build-app.sh"
      - "scripts/build-windows.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/screenshots.yml"

jobs:
  macos-screenshots:
    name: macOS screenshots
    runs-on: macos-latest
    outputs:
      artifact_url: ${{ steps.upload-screenshot.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0

      - name: Ensure Metal toolchain
        run: |
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal -v

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
          prefix-key: v1-rust-screenshots

      - name: Build app
        run: REMISS_ENABLE_SPARKLE=0 ./scripts/build-app.sh

      - name: Capture review workspace
        run: |
          ./scripts/capture-screenshot-macos.sh \
            --scenario review-workspace \
            --output screenshots/remiss-macos-review-workspace.png
          test -s screenshots/remiss-macos-review-workspace.png

      - name: Upload screenshot
        id: upload-screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: screenshots/remiss-macos-review-workspace.png
          archive: false

  windows-screenshots:
    name: Windows screenshots
    runs-on: windows-latest
    outputs:
      artifact_url: ${{ steps.upload-screenshot.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
          prefix-key: v1-rust-windows-screenshots

      - name: Build app
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Set screenshot display
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1200 -Force
          } else {
            Write-Warning "Set-DisplayResolution is not available on this runner."
          }
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary display: $($bounds.Width)x$($bounds.Height)"

      - name: Capture review workspace
        shell: pwsh
        run: |
          ./scripts/capture-screenshot-windows.ps1 `
            -Scenario review-workspace `
            -Output screenshots/remiss-windows-review-workspace.png
          if (!(Test-Path screenshots/remiss-windows-review-workspace.png) -or (Get-Item screenshots/remiss-windows-review-workspace.png).Length -le 0) {
            throw "Windows screenshot was not written"
          }

      - name: Upload screenshot
        id: upload-screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: screenshots/remiss-windows-review-workspace.png
          archive: false

  comment-screenshots:
    name: Comment screenshots
    runs-on: ubuntu-latest
    needs:
      - macos-screenshots
      - windows-screenshots
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.macos-screenshots.result == 'success' &&
      needs.windows-screenshots.result == 'success'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Post screenshot links
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MACOS_ARTIFACT_URL: ${{ needs.macos-screenshots.outputs.artifact_url }}
          WINDOWS_ARTIFACT_URL: ${{ needs.windows-screenshots.outputs.artifact_url }}
        run: |
          marker="<!-- remiss-screenshot-artifacts -->"
          comment_file="$RUNNER_TEMP/remiss-screenshot-comment.md"
          payload_file="$RUNNER_TEMP/remiss-screenshot-comment.json"

          cat > "$comment_file" <<EOF
          $marker
          ### Remiss screenshots

          | OS | Scenario | PNG artifact |
          | --- | --- | --- |
          | macOS | review-workspace | [remiss-macos-review-workspace.png]($MACOS_ARTIFACT_URL) |
          | Windows | review-workspace | [remiss-windows-review-workspace.png]($WINDOWS_ARTIFACT_URL) |

          Run: [Screenshots workflow]($RUN_URL)
          EOF

          jq -n --rawfile body "$comment_file" '{body: $body}' > "$payload_file"

          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" \
              | tail -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$payload_file" \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "$payload_file" \
              >/dev/null
          fi
