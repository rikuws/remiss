name: Screenshots

on:
  workflow_dispatch:

jobs:
  macos-screenshots:
    name: macOS screenshots
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0

      - name: Ensure Metal toolchain
        run: |
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal -v

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
          prefix-key: v1-rust-screenshots

      - name: Build app
        run: REMISS_ENABLE_SPARKLE=0 ./scripts/build-app.sh

      - name: Capture review workspace
        run: |
          ./scripts/capture-screenshot-macos.sh \
            --scenario review-workspace \
            --output screenshots/remiss-macos-review-workspace.png
          test -s screenshots/remiss-macos-review-workspace.png

      - name: Upload screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: screenshots/remiss-macos-review-workspace.png
          archive: false

  windows-screenshots:
    name: Windows screenshots
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          cache-bin: false
          prefix-key: v1-rust-windows-screenshots

      - name: Build app
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Set screenshot display
        shell: pwsh
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            Set-DisplayResolution -Width 1920 -Height 1200 -Force
          } else {
            Write-Warning "Set-DisplayResolution is not available on this runner."
          }
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Primary display: $($bounds.Width)x$($bounds.Height)"

      - name: Capture review workspace
        shell: pwsh
        run: |
          ./scripts/capture-screenshot-windows.ps1 `
            -Scenario review-workspace `
            -Output screenshots/remiss-windows-review-workspace.png
          if (!(Test-Path screenshots/remiss-windows-review-workspace.png) -or (Get-Item screenshots/remiss-windows-review-workspace.png).Length -le 0) {
            throw "Windows screenshot was not written"
          }

      - name: Upload screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: screenshots/remiss-windows-review-workspace.png
          archive: false
