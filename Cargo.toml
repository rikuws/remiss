[package]
name = "remiss"
version = "0.12.0"
description = "Human-centered desktop code review where computers and humans review together"
authors = ["Riku Wikman"]
edition = "2021"

[dependencies]
codex-codes = { version = "0.101", default-features = false, features = ["async-client"] }
dirs = "6"
difftastic = { git = "https://github.com/rikuws/difftastic", rev = "663819c98d27c4987ffb3f3575ea8be8df78452f" }
github-copilot-sdk = "1.0.0-beta.4"
sem-core = { git = "https://github.com/rikuws/sem", rev = "fa605d2ace4ee579c69b589920edd61cece92042" }
flate2 = "1"
gpui = "0.2"
emojis = "0.8.2"
json5 = { version = "0.4", optional = true }
libc = "0.2"
lucide-icons = "1.14"
once_cell = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = { version = "0.48.2", default-features = false, features = [
    "backtrace",
    "contexts",
    "debug-images",
    "native-tls",
    "panic",
    "ureq",
] }
sha1 = "0.10"
pulldown-cmark = "0.13"
giallo = { version = "0.3.1", features = ["dump"] }
tar = "0.4"
tree-sitter = "0.26.8"
tree-sitter-rust-orchard = "0.16.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
ureq = { version = "2.12", features = ["json"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[features]
default = ["tolerant-json"]
tolerant-json = ["dep:json5"]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10"
core-video = "0.4"
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-core-image = { version = "0.3.2", default-features = false, features = ["std", "CIContext", "CIImage", "CIKernel", "CIVector", "objc2-core-foundation", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVPixelBuffer"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSValue"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
velopack = "0.0.1298"
